build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  LongMethod:
    threshold: 120
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  ReturnCount:
    max: 4
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 18
  LargeClass:
    threshold: 800

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  WildcardImport:
    active: true
  ForbiddenComment:
    active: true
    comments: ["TODO:", "FIXME:", "STOPSHIP:"]
  UnusedPrivateMember:
    active: true
