name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default (review M-F): only the release job below, which runs
# exclusively on version tags, may write repository contents.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Binary assets are not tracked in git (see docs/DECISIONS.md):
      # the wrapper jar is regenerated and the Vazirmatn fonts are fetched
      # at the exact pinned versions the local tree carries.
      - name: Regenerate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Fetch Vazirmatn fonts (v33.003)
        run: |
          cd core/designsystem/src/main/res/font
          curl -fsSL -o vazirmatn_regular.ttf https://github.com/rastikerdar/vazirmatn/raw/v33.003/fonts/ttf/Vazirmatn-Regular.ttf
          curl -fsSL -o vazirmatn_medium.ttf https://github.com/rastikerdar/vazirmatn/raw/v33.003/fonts/ttf/Vazirmatn-Medium.ttf
          curl -fsSL -o vazirmatn_bold.ttf https://github.com/rastikerdar/vazirmatn/raw/v33.003/fonts/ttf/Vazirmatn-Bold.ttf
          # Pin the payloads (review M-F): these are the SHA-256 digests of
          # the exact TTF files the local tree bundles.
          printf '%s  %s\n' b69fd4c680b8f3f225feabcc655a2c585d97627b8f5f5c0f9985e894069f3a56 vazirmatn_regular.ttf | sha256sum -c -
          printf '%s  %s\n' b986623e4ddef10755e04be39f8ea7bcb1dc08bfe8dd0aa6af395736f256ad4a vazirmatn_medium.ttf | sha256sum -c -
          printf '%s  %s\n' f635fdbea28f265de395ba83b4b1570dcf2f58d13c65469e61903b1c2d2ae723 vazirmatn_bold.ttf | sha256sum -c -

      - name: Generate launcher icons
        run: |
          base64 -d app/art/launcher-art.b64 > /tmp/launcher-art.jpg
          cat > /tmp/GenIcons.java <<'JAVA_EOF'
          import java.awt.Graphics2D;
          import java.awt.RenderingHints;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          public class GenIcons {
              static void write(BufferedImage src, int size, File out) throws Exception {
                  BufferedImage dst = new BufferedImage(size, size, BufferedImage.TYPE_INT_RGB);
                  Graphics2D g = dst.createGraphics();
                  g.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC);
                  g.drawImage(src, 0, 0, size, size, null);
                  g.dispose();
                  out.getParentFile().mkdirs();
                  ImageIO.write(dst, "png", out);
              }
              public static void main(String[] args) throws Exception {
                  BufferedImage src = ImageIO.read(new File("/tmp/launcher-art.jpg"));
                  String base = "app/src/main/res/mipmap-";
                  String[][] specs = {{"mdpi", "48"}, {"hdpi", "72"}, {"xhdpi", "96"}, {"xxhdpi", "144"}, {"xxxhdpi", "192"}};
                  for (String[] sp : specs) {
                      int size = Integer.parseInt(sp[1]);
                      write(src, size, new File(base + sp[0] + "/ic_launcher.png"));
                      write(src, size, new File(base + sp[0] + "/ic_launcher_round.png"));
                  }
                  write(src, 432, new File(base + "xxxhdpi/ic_launcher_art.png"));
              }
          }
          JAVA_EOF
          java -Djava.awt.headless=true /tmp/GenIcons.java

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest lint detekt --stacktrace

      - name: Compile instrumented tests
        # Compile gate for the androidTest source set (review M-G): the Room
        # migration test must keep compiling; it executes on device/emulator.
        run: ./gradlew :core:data:assembleDebugAndroidTest --stacktrace

      - name: Exercise release build (R8)
        # Minification runs on every build (review M-F), not only when the
        # signing secrets are present; the signed step below re-runs it with
        # the keystore environment when available.
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cinesort-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      # Release signing (keystore arrives from repo secrets, never from git).
      - name: Decode release keystore
        id: ks
        run: |
          if [ -n "${{ secrets.CINESORT_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.CINESORT_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.ks.outputs.present == 'true'
        env:
          CINESORT_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          CINESORT_KEYSTORE_PASSWORD: ${{ secrets.CINESORT_KEYSTORE_PASSWORD }}
          CINESORT_KEY_ALIAS: ${{ secrets.CINESORT_KEY_ALIAS }}
          CINESORT_KEY_PASSWORD: ${{ secrets.CINESORT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: success() && steps.ks.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cinesort-release-apk
          path: app/build/outputs/apk/release/*.apk

  # Tag builds publish the GitHub Release the in-app updater reads:
  # CineSort-<version>.apk plus its .sha256 sidecar. This is the only job
  # allowed to write repository contents (review M-F).
  release:
    name: Publish GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches versionName
        # A tag that disagrees with the packaged version makes the in-app
        # updater offer the same update forever (review M-E): fail loudly.
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "$VERSION_NAME" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME in app/build.gradle.kts"
            exit 1
          fi

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: cinesort-release-apk
          path: release-apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK=$(ls release-apk/*.apk | head -1)
          cp "$APK" "CineSort-$VERSION.apk"
          sha256sum "CineSort-$VERSION.apk" > "CineSort-$VERSION.apk.sha256"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "CineSort $GITHUB_REF_NAME" --notes "CineSort $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "CineSort-$VERSION.apk" "CineSort-$VERSION.apk.sha256" --clobber
